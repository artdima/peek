name: Feature request
description: Suggest something Peek should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Peek is a presentation layer: it shows network calls, and never
        performs, intercepts or changes one. Support for another logger is
        an adapter — use the "New adapter" template for that.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Peek get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: >-
        A screen, an option, an API — as concretely as you can. A sketch of
        the call site is worth a paragraph.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other packages, or why none of them fit.
