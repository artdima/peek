name: New adapter
description: Ask for — or offer — support for another logger or HTTP client.
labels: [adapter]
body:
  - type: markdown
    attributes:
      value: |
        An adapter is its own package, `peek_<logger>`, depending on
        `package:peek/core.dart` and the logger. `doc/adapters.md` is the
        guide; this issue is where we agree it is worth having.

  - type: input
    id: logger
    attributes:
      label: The logger or client
      placeholder: package:http, chopper, retrofit, …
    validations:
      required: true

  - type: textarea
    id: observation
    attributes:
      label: What it lets an observer see
      description: >-
        Which hooks it offers, whether request and response arrive as the
        same object (so they can be correlated), and whether bodies are
        readable or only streamed.
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Are you offering to write it?
      options:
        - label: I would like to write this adapter myself.
