name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push made by a workflow does not start another one, so the run that
  # follows a golden rewrite has to be asked for.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run melos run format:check
      - run: dart run melos run analyze
      - run: dart run melos run test:coverage

      # Each package reports paths relative to itself; prefix them so one
      # merged report maps back onto the repository.
      - name: Merge coverage reports
        run: |
          shopt -s nullglob
          mkdir -p coverage
          for report in packages/*/coverage/lcov.info; do
            package=$(dirname "$(dirname "$report")")
            sed "s|^SF:\([^/]\)|SF:$package/\1|" "$report"
          done > coverage/lcov.info

      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  example:
    name: Example app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: packages/peek/example

  floor:
    name: Minimum Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [peek, peek_dio, peek_talker]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true

      # The workspace tooling needs a newer Dart than the packages promise,
      # so each package is checked on its own against the oldest SDK it claims.
      - name: Detach the package from the workspace
        run: |
          cp -r packages/${{ matrix.package }} "$RUNNER_TEMP/floor"
          cd "$RUNNER_TEMP/floor"
          rm -rf example
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          rm -f analysis_options.yaml test/analysis_options.yaml
          # An adapter depends on packages that are not published yet, so
          # the copies in this checkout stand in for them.
          case "${{ matrix.package }}" in
            peek) siblings="" ;;
            peek_dio) siblings="peek" ;;
            peek_talker) siblings="peek peek_dio" ;;
          esac
          if [ -n "$siblings" ]; then
            printf '\ndependency_overrides:\n' >> pubspec.yaml
            for sibling in $siblings; do
              cp -r "$GITHUB_WORKSPACE/packages/$sibling" "$RUNNER_TEMP/$sibling"
              sed -i '/^resolution: workspace$/d' \
                "$RUNNER_TEMP/$sibling/pubspec.yaml"
              printf '  %s:\n    path: %s\n' "$sibling" \
                "$RUNNER_TEMP/$sibling" >> pubspec.yaml
            done
          fi

      - run: flutter pub get
        working-directory: ${{ runner.temp }}/floor
      # The floor is a floor on dependencies too: the oldest version of
      # each that the pubspec admits is the one the package must build on.
      - run: flutter pub downgrade
        working-directory: ${{ runner.temp }}/floor
      - run: flutter analyze --fatal-infos
        working-directory: ${{ runner.temp }}/floor
      # Goldens are authored on the pinned Flutter; an older one draws
      # them differently, and that difference is not a regression.
      - run: flutter test
        working-directory: ${{ runner.temp }}/floor
        env:
          PEEK_GOLDENS: '0'

  pana:
    name: pub.dev score (${{ matrix.package }})
    runs-on: ubuntu-latest
    # Advisory until the packages are ready for pub.dev; then make it blocking.
    continue-on-error: true
    strategy:
      matrix:
        package: [peek, peek_dio, peek_talker]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: dart pub global activate pana
      # The workspace resolves an adapter's peek dependency from this
      # checkout; pana scores the package as pub.dev would see it, so an
      # unpublished dependency costs points until peek is up.
      - run: >-
          dart pub global run pana
          --no-warning --exit-code-threshold 0
          packages/${{ matrix.package }}
