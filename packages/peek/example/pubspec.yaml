name: peek_example
description: An app that makes real calls through Dio, Talker and Chopper and reads them in Peek.
publish_to: none
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  chopper: '>=8.4.0 <9.0.0'
  dio: ^5.10.0
  flutter:
    sdk: flutter
  peek: ^1.0.0
  peek_chopper: ^1.0.0
  peek_dio: ^1.0.0
  peek_talker: ^1.0.0
  share_plus: ^10.1.0
  talker: ^5.0.0
  talker_dio_logger: ^5.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
