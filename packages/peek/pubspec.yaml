name: peek
description: >-
  A beautiful in-app viewer for the network logs your Flutter app already
  collects.
version: 1.3.0
resolution: workspace

repository: https://github.com/artdima/peek/tree/main/packages/peek
issue_tracker: https://github.com/artdima/peek/issues
homepage: https://github.com/artdima/peek

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

flutter:
  uses-material-design: true

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter

screenshots:
  - description: The calls an app has made, newest first.
    path: screenshots/console-light.png
  - description: The same list in the dark theme Peek follows from the app.
    path: screenshots/console-dark.png
  - description: One call in full, with what it sent and what came back.
    path: screenshots/call.png
  - description: A JSON response as a tree that folds, searches and copies.
    path: screenshots/body-json.png
  - description: A failed call, with the error the client raised.
    path: screenshots/error.png
  - description: Filters built from what is actually in the list.
    path: screenshots/filters.png

topics:
  - debugging
  - devtools
  - http
  - logging
  - network
